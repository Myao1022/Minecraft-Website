<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myao1022 · 我的世界 网页版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            background: #2d2d2d;
            font-family: 'Press Start 2P', monospace, 'Courier New';
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                repeating-linear-gradient(45deg, #7c5a3a 0px, #7c5a3a 2px, #5c3d21 2px, #5c3d21 4px);
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #c6c6c6;
            border: 8px solid #8b8b8b;
            box-shadow: inset -4px -4px 0 #4c4c4c, inset 4px 4px 0 #ffffff, 0 20px 60px rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
        }
        .header {
            background: #4a4a4a;
            padding: 12px 18px;
            border: 4px solid #6b6b6b;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset -2px -2px 0 #2a2a2a, inset 2px 2px 0 #8a8a8a;
        }
        .header h1 { color: #f0f0f0; font-size: 18px; text-shadow: 3px 3px 0 #1a1a1a; letter-spacing: 2px; }
        .header h1 span { color: #7cfc00; }
        .badge {
            background: #2a2a2a;
            color: #ffcc00;
            padding: 6px 12px;
            font-size: 10px;
            border: 2px solid #5a5a5a;
            box-shadow: inset -1px -1px 0 #000;
        }
        .preview-wrapper {
            background: #000;
            border: 6px solid #7a7a7a;
            box-shadow: inset -3px -3px 0 #3a3a3a, inset 3px 3px 0 #aaaaaa;
            margin-bottom: 20px;
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-wrapper img { width:100%; height:100%; object-fit:cover; display:block; background:#1a1a1a; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            color: #fff;
            background: #3a8a3a;
            border: 4px solid #6bc06b;
            box-shadow: inset -4px -4px 0 #1d4a1d, inset 4px 4px 0 #8fd88f, 0 6px 0 #1d3a1d;
            transition: all 0.05s linear;
            cursor: pointer;
            flex: 1 1 200px;
            text-align: center;
            letter-spacing: 1px;
        }
        .btn:hover { transform:translateY(2px); box-shadow:inset -4px -4px 0 #1d4a1d, inset 4px 4px 0 #8fd88f, 0 4px 0 #1d3a1d; }
        .btn:active { transform:translateY(6px); box-shadow:inset -4px -4px 0 #1d4a1d, inset 4px 4px 0 #8fd88f, 0 0px 0 #1d3a1d; }
        .btn-download {
            background: #2a6b8a;
            border-color: #4a9fc7;
            box-shadow: inset -4px -4px 0 #124a5a, inset 4px 4px 0 #7ac7e7, 0 6px 0 #0d2a3a;
        }
        .btn-download:hover { box-shadow:inset -4px -4px 0 #124a5a, inset 4px 4px 0 #7ac7e7, 0 4px 0 #0d2a3a; }
        .btn-download:active { box-shadow:inset -4px -4px 0 #124a5a, inset 4px 4px 0 #7ac7e7, 0 0px 0 #0d2a3a; }
        .btn svg { width:24px; height:24px; fill:currentColor; flex-shrink:0; }
        .footer-note {
            text-align: center;
            margin-top: 25px;
            color: #6a6a6a;
            font-size: 9px;
            border-top: 4px solid #8a8a8a;
            padding-top: 18px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #dfdfdf;
        }
        @media (max-width: 640px) {
            .header h1 { font-size:12px; }
            .badge { font-size:8px; }
            .btn { font-size:10px; padding:14px 16px; flex:1 1 100%; }
            .preview-wrapper { aspect-ratio:4/3; }
            .container { padding:10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>Minecraft</span> · 网页端</h1>
            <div class="badge">SB3 测试项目 · 免费</div>
        </div>
        <div class="preview-wrapper">
            <img src="preview.png" alt="Minecraft 游戏宣传图">
        </div>
        <div class="actions">
            <!-- 移除了 target="_blank"，在当前标签页打开 -->
            <a href="game.html" class="btn" id="btn-play" title="打开游戏">
                <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6m4-3h6v6m-11 5L21 3"/></svg>
                在线预览
            </a>
            <!-- 移除了 target="_blank"，在当前标签页打开 -->
            <a href="download.html" class="btn btn-download" id="btn-download" title="选择下载版本">
                <svg viewBox="0 0 24 24"><path d="M5 20h14M12 4v12m-4-4l4 4 4-4"/></svg>
                下载离线版 (EXE或HTML)
            </a>
        </div>
        <div class="footer-note">在线预览即开即玩 · 离线版无需网络 · 由 Myao1022 提供</div>
    </div>

    <!-- 背景音乐（自动循环，无控制按钮） -->
    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <script>
        (function() {
            // ----- 背景音乐自动播放 -----
            var bgAudio = document.getElementById('bg-music');
            var bgStarted = false;
            function tryPlayBg() {
                if (bgStarted) return;
                bgAudio.play().then(function() {
                    bgStarted = true;
                }).catch(function(e) {});
            }
            tryPlayBg();
            function handleFirstClick() {
                if (!bgStarted) {
                    bgAudio.play().then(function() { bgStarted = true; }).catch(function(e) {});
                }
                document.removeEventListener('click', handleFirstClick);
                document.removeEventListener('touchstart', handleFirstClick);
            }
            document.addEventListener('click', handleFirstClick);
            document.addEventListener('touchstart', handleFirstClick);
            bgAudio.addEventListener('ended', function() {
                bgAudio.currentTime = 0;
                bgAudio.play();
            });

            // ----- 按钮点击音效（只播放一次） -----
            function playClickSound() {
                var sound = new Audio('按钮点.mp3');
                sound.play().catch(function(e) {});
            }

            document.getElementById('btn-play').addEventListener('click', function(e) {
                playClickSound();
                // 注意：这里不阻止默认行为，点击后会跳转
            });
            document.getElementById('btn-download').addEventListener('click', function(e) {
                playClickSound();
                // 不阻止默认行为
            });
        })();
    </script>
</body>
</html>
